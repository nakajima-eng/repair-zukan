<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="修理図鑑" />
  <title>修理図鑑</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Firebase SDK (CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, orderBy }
      from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
    import { getStorage, ref, uploadString, getDownloadURL, deleteObject }
      from "https://www.gstatic.com/firebasejs/11.0.1/firebase-storage.js";

    // ========== Firebase設定 ==========
    const firebaseConfig = {
      apiKey: "AIzaSyCA3fMfqRD30-XG4KxF3lWh1rS7F-aICm8",
      authDomain: "repair-zukan.firebaseapp.com",
      projectId: "repair-zukan",
      storageBucket: "repair-zukan.firebasestorage.app",
      messagingSenderId: "247144844067",
      appId: "1:247144844067:web:00134c4c1cc362ca755a96"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);
    const storage = getStorage(app);

    // ========== 状態 ==========
    let currentUser = null;
    let records = [];
    let unsubscribe = null;
    let currentTab = 'すべて';
    let editingId = null;
    let photoPreviews = []; // {type:'url'|'base64', data:string, storePath?:string}[]
    let lbPhotos = [], lbIndex = 0, lbTouchStartX = 0, lbScale = 1, lbLastDist = 0;

    const CATEGORIES = ['給湯器', 'エアコン', 'バス乾', '食洗機', 'ハウジングエアコン（HAC）', 'パッケージエアコン（PAC）'];

    // ========== Auth ==========
    window.loginGoogle = async () => {
      try {
        const provider = new GoogleAuthProvider();
        await signInWithPopup(auth, provider);
      } catch(e) { alert('ログインに失敗しました: ' + e.message); }
    };
    window.logout = async () => {
      if (!confirm('ログアウトしますか？')) return;
      if (unsubscribe) unsubscribe();
      await signOut(auth);
    };

    onAuthStateChanged(auth, user => {
      currentUser = user;
      if (user) {
        showApp();
        subscribeRecords();
      } else {
        if (unsubscribe) { unsubscribe(); unsubscribe = null; }
        showLogin();
      }
    });

    function showLogin() {
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('mainApp').style.display = 'none';
    }
    function showApp() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainApp').style.display = 'flex';
      document.getElementById('userEmail').textContent = currentUser.email || currentUser.displayName || '';
    }

    // ========== Firestore購読 ==========
    function subscribeRecords() {
      if (unsubscribe) unsubscribe();
      const q = query(
        collection(db, 'users', currentUser.uid, 'records'),
        orderBy('createdAt', 'desc')
      );
      unsubscribe = onSnapshot(q, snap => {
        records = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderList();
      }, err => console.error(err));
    }

    // ========== 画像処理 ==========
    function compressImage(file) {
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const MAX = 1200; // Storage保存なので少し大きめ
            let w = img.width, h = img.height;
            if (w > h) { if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; } }
            else       { if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; } }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.75));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function uploadPhoto(base64, recordId, index) {
      const path = `users/${currentUser.uid}/photos/${recordId}_${index}_${Date.now()}.jpg`;
      const storageRef = ref(storage, path);
      await uploadString(storageRef, base64, 'data_url');
      const url = await getDownloadURL(storageRef);
      return { url, path };
    }

    // ========== 写真ハンドラ ==========
    window.handlePhotos = async (e) => {
      setLoading(true, '写真を処理中...');
      try {
        const compressed = await Promise.all(Array.from(e.target.files).map(compressImage));
        compressed.forEach(b64 => photoPreviews.push({ type: 'base64', data: b64 }));
        renderPhotoPreviews();
      } finally { setLoading(false); }
      e.target.value = '';
    };

    window.removePhoto = (i) => { photoPreviews.splice(i, 1); renderPhotoPreviews(); };

    function renderPhotoPreviews() {
      document.getElementById('photoPreviews').innerHTML = photoPreviews.map((p, i) =>
        `<div class="photo-preview-wrap">
          <img class="photo-preview" src="${p.type==='url'?p.url:p.data}" alt="" loading="lazy">
          <button class="photo-del" onclick="removePhoto(${i})" type="button">✕</button>
        </div>`).join('');
    }

    // ========== 保存 ==========
    window.saveRecord = async () => {
      const model = document.getElementById('fModel').value.trim();
      if (!model) { alert('機種名・型番を入力してください'); return; }
      setLoading(true, '保存中...');
      try {
        const recId = editingId || doc(collection(db, 'dummy')).id;

        // 写真を並列アップロード（全枚数同時処理で高速化）
        const photoResults = await Promise.all(
          photoPreviews.map((p, i) =>
            p.type === 'base64'
              ? uploadPhoto(p.data, recId, i)
              : Promise.resolve({ url: p.url, path: p.path || '' })
          )
        );

        const now = new Date();
        const rec = {
          category: document.getElementById('fCategory').value,
          model,
          errorCode: document.getElementById('fError').value.trim(),
          partNo: document.getElementById('fPart').value.trim(),
          memo: document.getElementById('fMemo').value.trim(),
          photos: photoResults,
          updatedAt: now.toISOString(),
          createdAt: editingId
            ? (records.find(r=>r.id===editingId)?.createdAt || now.toISOString())
            : now.toISOString(),
          date: editingId
            ? (records.find(r=>r.id===editingId)?.date || now.toLocaleDateString('ja-JP'))
            : now.toLocaleDateString('ja-JP'),
        };

        await setDoc(doc(db, 'users', currentUser.uid, 'records', recId), rec);
        closeOverlay('formOverlay');
      } catch(e) {
        alert('保存に失敗しました: ' + e.message);
      } finally { setLoading(false); }
    };

    // ========== 削除 ==========
    async function doDelete(id) {
      if (!confirm('この記録を削除しますか？')) return;
      setLoading(true, '削除中...');
      try {
        const r = records.find(x => x.id === id);
        // Storageの写真も削除
        if (r?.photos) {
          for (const p of r.photos) {
            if (p.path) {
              try { await deleteObject(ref(storage, p.path)); } catch {}
            }
          }
        }
        await deleteDoc(doc(db, 'users', currentUser.uid, 'records', id));
        closeOverlay('detailOverlay');
        closeOverlay('formOverlay');
      } catch(e) {
        alert('削除に失敗しました: ' + e.message);
      } finally { setLoading(false); }
    }
    window.deleteRecordById = doDelete;
    window.deleteRecord = () => doDelete(editingId);

    // ========== フォーム ==========
    window.openForm = (id) => {
      editingId = id;
      const r = id ? records.find(x => x.id === id) : null;
      document.getElementById('formTitle').textContent = r ? '記録を編集' : '新規登録';
      document.getElementById('fCategory').innerHTML = CATEGORIES.map(c =>
        `<option${r&&r.category===c?' selected':''}>${c}</option>`).join('');
      document.getElementById('fModel').value = r?.model || '';
      document.getElementById('fError').value = r?.errorCode || '';
      document.getElementById('fPart').value = r?.partNo || '';
      document.getElementById('fMemo').value = r?.memo || '';
      document.getElementById('delBtn').style.display = r ? 'block' : 'none';
      photoPreviews = r?.photos
        ? r.photos.map(p => ({ type: 'url', url: p.url, path: p.path }))
        : [];
      renderPhotoPreviews();
      openOverlay('formOverlay');
    };

    // ========== 詳細 ==========
    window.openDetail = (id) => {
      const r = records.find(x => x.id === id);
      if (!r) return;
      document.getElementById('detailTitle').textContent = r.model || '';
      document.getElementById('detailEditBtn').onclick = () => { closeOverlay('detailOverlay'); openForm(id); };
      let html = '';
      if (r.photos && r.photos.length > 0) {
        const urls = r.photos.map(p => p.url);
        const encoded = encodeURIComponent(JSON.stringify(urls));
        html += `<div class="detail-photos" id="dPhotos" data-photos="${encoded}">` +
          urls.map((url, i) =>
            `<img class="detail-photo" src="${url}" alt="" loading="lazy" onclick="lbFromDetail(${i})">`
          ).join('') + `</div>`;
      }
      html += sec('カテゴリ', r.category||'');
      html += sec('機種名・型番', `<span class="detail-mono">${esc(r.model||'')}</span>`);
      if (r.errorCode) html += sec('エラーコード', `<span class="detail-mono detail-error">${esc(r.errorCode)}</span>`);
      if (r.partNo) html += sec('部品番号', `<span class="detail-mono">${esc(r.partNo)}</span>`);
      if (r.memo) html += sec('修理内容メモ', esc(r.memo).replace(/\n/g,'<br>'));
      html += sec('登録日', r.date||'');
      html += `<button class="del-btn" onclick="deleteRecordById('${r.id}')">🗑 この記録を削除</button>`;
      document.getElementById('detailBody').innerHTML = html;
      openOverlay('detailOverlay');
    };

    window.lbFromDetail = (index) => {
      const el = document.getElementById('dPhotos');
      if (!el) return;
      openLightbox(JSON.parse(decodeURIComponent(el.dataset.photos)), index);
    };

    // ========== ライトボックス ==========
    let lbTx = 0, lbTy = 0;            // 拡大中の移動量
    let lbPanX = 0, lbPanY = 0;        // 1本指ドラッグの前回座標
    let lbPanning = false;
    let lbCx = 0, lbCy = 0;            // ピンチ開始時の画像中心（無変形時）
    let lbLastTap = 0, lbTouchStartY = 0;

    function lbCurImg() {
      return document.querySelector('.lb-slide:nth-child('+(lbIndex+1)+') img');
    }

    // 移動範囲を画像内に制限してtransformを適用
    function lbApply() {
      const img = lbCurImg();
      if (!img) return;
      const maxX = Math.max(0, (lbScale - 1) * img.offsetWidth  / 2);
      const maxY = Math.max(0, (lbScale - 1) * img.offsetHeight / 2);
      lbTx = Math.min(maxX, Math.max(-maxX, lbTx));
      lbTy = Math.min(maxY, Math.max(-maxY, lbTy));
      img.style.transform = `translate(${lbTx}px, ${lbTy}px) scale(${lbScale})`;
    }

    // ダブルタップ：タップ位置を中心に2.5倍 ⇔ 等倍
    function lbDoubleTap(x, y) {
      const img = lbCurImg();
      if (!img) return;
      img.style.transition = 'transform 0.2s';
      if (lbScale > 1.05) {
        lbScale = 1; lbTx = 0; lbTy = 0;
      } else {
        const r = img.getBoundingClientRect();
        const cx = r.left + r.width / 2 - lbTx;
        const cy = r.top  + r.height / 2 - lbTy;
        const ns = 2.5;
        lbTx = (x - cx) - (ns / lbScale) * ((x - cx) - lbTx);
        lbTy = (y - cy) - (ns / lbScale) * ((y - cy) - lbTy);
        lbScale = ns;
      }
      lbApply();
      setTimeout(() => { const i = lbCurImg(); if (i) i.style.transition = 'none'; }, 220);
    }

    window.openLightbox = (photos, index) => {
      lbPhotos = photos; lbIndex = index;
      lbScale = 1; lbTx = 0; lbTy = 0;
      const slides = document.getElementById('lbSlides');
      slides.style.transition = 'none';
      slides.innerHTML = photos.map(url =>
        `<div class="lb-slide"><img src="${url}" alt="" id="lbImg${photos.indexOf(url)}"></div>`
      ).join('');
      slides.style.transform = `translateX(-${index * 100}%)`;
      updateLightbox();
      document.getElementById('lightbox').classList.add('open');

      const track = document.getElementById('lbTrack');
      track.ontouchstart = e => {
        const img = lbCurImg();
        if (img) img.style.transition = 'none';
        if (e.touches.length === 1) {
          lbTouchStartX = e.touches[0].clientX;
          lbTouchStartY = e.touches[0].clientY;
          lbPanX = e.touches[0].clientX;
          lbPanY = e.touches[0].clientY;
          lbPanning = lbScale > 1.05;
          lbLastDist = 0;
        }
        if (e.touches.length === 2) {
          lbPanning = false;
          lbLastDist = getTouchDist(e);
          if (img) {
            const r = img.getBoundingClientRect();
            lbCx = r.left + r.width / 2 - lbTx;
            lbCy = r.top  + r.height / 2 - lbTy;
          }
        }
      };
      track.ontouchmove = e => {
        // 1本指：拡大中はパン（移動）
        if (e.touches.length === 1 && lbPanning) {
          e.preventDefault();
          lbTx += e.touches[0].clientX - lbPanX;
          lbTy += e.touches[0].clientY - lbPanY;
          lbPanX = e.touches[0].clientX;
          lbPanY = e.touches[0].clientY;
          lbApply();
          return;
        }
        // 2本指：ピンチ位置を中心にズーム
        if (e.touches.length === 2) {
          e.preventDefault();
          const dist = getTouchDist(e);
          if (lbLastDist > 0) {
            const ns = Math.min(5, Math.max(1, lbScale * (dist / lbLastDist)));
            const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - lbCx;
            const my = (e.touches[0].clientY + e.touches[1].clientY) / 2 - lbCy;
            lbTx = mx - (ns / lbScale) * (mx - lbTx);
            lbTy = my - (ns / lbScale) * (my - lbTy);
            lbScale = ns;
            if (lbScale <= 1.02) { lbScale = 1; lbTx = 0; lbTy = 0; }
            lbApply();
          }
          lbLastDist = dist;
        }
      };
      track.ontouchend = e => {
        if (e.touches.length > 0) return; // まだ指が残っている
        const t = e.changedTouches[0];
        const dx = t.clientX - lbTouchStartX;
        const dy = t.clientY - lbTouchStartY;
        const moved = Math.abs(dx) > 12 || Math.abs(dy) > 12;
        const now = Date.now();
        // ダブルタップ判定
        if (!moved && lbLastDist === 0) {
          if (now - lbLastTap < 300) {
            lbDoubleTap(t.clientX, t.clientY);
            lbLastTap = 0;
            return;
          }
          lbLastTap = now;
        }
        // 等倍のときだけスワイプで写真切り替え
        if (!lbPanning && lbScale <= 1.05 && Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
          lbMove(dx < 0 ? 1 : -1);
        }
        lbPanning = false;
      };
    };

    function getTouchDist(e) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      return Math.sqrt(dx*dx + dy*dy);
    }

    window.closeLightbox = () => {
      document.getElementById('lightbox').classList.remove('open');
      lbScale = 1; lbTx = 0; lbTy = 0;
    };
    window.lbResetZoom = () => {
      lbScale = 1; lbTx = 0; lbTy = 0;
      const img = lbCurImg();
      if (img) { img.style.transition = 'transform 0.2s'; img.style.transform = 'translate(0,0) scale(1)'; }
    };
    window.lbMove = (dir) => {
      lbResetZoom();
      lbIndex = Math.max(0, Math.min(lbPhotos.length - 1, lbIndex + dir));
      const slides = document.getElementById('lbSlides');
      slides.style.transition = 'transform 0.25s ease';
      slides.style.transform = `translateX(-${lbIndex * 100}%)`;
      updateLightbox();
    };

    function updateLightbox() {
      document.getElementById('lbCounter').textContent =
        lbPhotos.length > 1 ? `${lbIndex + 1} / ${lbPhotos.length}` : '';
      document.getElementById('lbPrev').style.display = lbIndex > 0 ? 'flex' : 'none';
      document.getElementById('lbNext').style.display = lbIndex < lbPhotos.length - 1 ? 'flex' : 'none';
      document.getElementById('lbDots').innerHTML = lbPhotos.length > 1
        ? lbPhotos.map((_, i) => `<div class="lb-dot${i===lbIndex?' active':''}"></div>`).join('') : '';
    }

    // ========== リスト ==========
    window.renderList = () => {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = records.filter(r => {
        const m = !q || [(r.model||''),(r.memo||''),(r.errorCode||''),(r.partNo||'')]
          .some(v => v.toLowerCase().includes(q));
        return m && (currentTab === 'すべて' || r.category === currentTab);
      });
      const cntText = (q || currentTab !== 'すべて')
        ? `<b>${filtered.length}</b>件 / 全${records.length}件`
        : `全 <b>${records.length}</b> 件の記録`;
      const list = document.getElementById('list');
      if (filtered.length === 0) {
        list.innerHTML = `<div class="count-badge">${cntText}</div>
          <div class="empty"><div class="empty-icon">🔧</div>
          <p>${records.length===0?'まだ記録がありません\n「＋ 追加」から登録しましょう':'該当する記録がありません'}</p></div>`;
        return;
      }
      list.innerHTML = `<div class="count-badge">${cntText}</div>` + filtered.map(r => `
        <div class="card" onclick="openDetail('${r.id}')">
          <div class="card-inner">
            <div class="card-thumb">${r.photos&&r.photos[0]
              ? `<img src="${r.photos[0].url}" alt="" loading="lazy">` : '📷'}</div>
            <div class="card-info">
              <div class="card-cat">${r.category||''}</div>
              <div class="card-model">${esc(r.model||'')}</div>
              <div class="card-memo">${esc(r.memo||'—')}</div>
              <div class="card-tags">
                ${r.errorCode?`<span class="tag tag-error">E: ${esc(r.errorCode)}</span>`:''}
                ${r.partNo?`<span class="tag tag-part">P: ${esc(r.partNo)}</span>`:''}
              </div>
              <div class="card-date">${r.date||''}</div>
            </div>
          </div>
        </div>`).join('');
    };

    // ========== タブ ==========
    window.setTab = (t) => { currentTab = t; renderTabs(); renderList(); };
    window.renderTabs = () => {
      document.getElementById('tabs').innerHTML = ['すべて',...CATEGORIES].map(c =>
        `<button class="tab${currentTab===c?' active':''}" onclick="setTab('${c}')">${c}</button>`).join('');
    };

    // ========== ユーティリティ ==========
    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function sec(label, value) {
      return `<div class="detail-section"><div class="detail-label">${label}</div><div class="detail-value">${value}</div></div>`;
    }
    function setLoading(on, msg='') {
      const el = document.getElementById('loadingOverlay');
      el.style.display = on ? 'flex' : 'none';
      if (msg) document.getElementById('loadingMsg').textContent = msg;
    }
    window.openOverlay = (id) => document.getElementById(id).classList.add('open');
    window.closeOverlay = (id) => document.getElementById(id).classList.remove('open');

    // 初期化
    renderTabs();
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface2: #222534; --border: #2e3246;
      --accent: #f97316; --text: #e8eaf0; --text2: #8b90a8;
      --blue: #60a5fa; --red: #f87171; --green: #22c55e;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Noto Sans JP', sans-serif; }

    /* ログイン画面 */
    #loginScreen {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px; z-index: 999; padding: 32px;
    }
    .login-logo { font-size: 32px; font-weight: 700; }
    .login-logo span { color: var(--accent); }
    .login-sub { font-size: 13px; color: var(--text2); text-align: center; line-height: 1.8; }
    .google-btn {
      display: flex; align-items: center; gap: 10px;
      background: #fff; color: #333; border: none; border-radius: 10px;
      padding: 14px 24px; font-size: 15px; font-weight: 700; cursor: pointer;
      font-family: 'Noto Sans JP', sans-serif; width: 100%; justify-content: center;
      max-width: 320px;
    }

    /* メインアプリ */
    #mainApp { max-width: 430px; margin: 0 auto; min-height: 100vh; display: none; flex-direction: column; }

    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 16px 10px; position: sticky; top: 0; z-index: 100; }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .logo { font-size: 18px; font-weight: 700; }
    .logo span { color: var(--accent); }
    .btn-group { display: flex; gap: 8px; align-items: center; }
    .add-btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; }
    .icon-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 13px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; }
    .user-bar { font-size: 11px; color: var(--text2); display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .search-wrap { position: relative; }
    .search-input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px 8px 36px; color: var(--text); font-size: 14px; font-family: 'Noto Sans JP', sans-serif; outline: none; }
    .search-input::placeholder { color: var(--text2); }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text2); }

    .tabs { display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto; background: var(--surface); border-bottom: 1px solid var(--border); scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex-shrink: 0; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text2); font-family: 'Noto Sans JP', sans-serif; }
    .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .list { flex: 1; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
    .count-badge { font-size: 12px; color: var(--text2); padding: 4px 0; }
    .count-badge b { color: var(--accent); }
    .empty { text-align: center; padding: 60px 20px; color: var(--text2); }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty p { font-size: 14px; line-height: 1.8; white-space: pre-line; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; }
    .card:active { border-color: var(--accent); }
    .card-inner { display: flex; gap: 12px; padding: 12px; }
    .card-thumb { width: 72px; height: 72px; min-width: 72px; border-radius: 8px; background: var(--surface2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--text2); font-size: 24px; overflow: hidden; }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-info { flex: 1; min-width: 0; }
    .card-cat { font-size: 11px; color: var(--accent); font-weight: 600; margin-bottom: 2px; }
    .card-model { font-size: 15px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-memo { font-size: 12px; color: var(--text2); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-tags { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
    .tag { font-size: 10px; padding: 2px 7px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-weight: 600; }
    .tag-error { background: rgba(248,113,113,0.15); color: var(--red); }
    .tag-part { background: rgba(96,165,250,0.15); color: var(--blue); }
    .card-date { font-size: 10px; color: var(--text2); margin-top: 4px; }

    .overlay { position: fixed; inset: 0; background: var(--bg); z-index: 200; display: none; flex-direction: column; max-width: 430px; margin: 0 auto; }
    .overlay.open { display: flex; animation: slideUp 0.2s ease; }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .overlay-header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .back-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 12px; font-size: 14px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; }
    .overlay-title { font-size: 16px; font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .overlay-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

    .detail-photos { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; -webkit-overflow-scrolling: touch; min-height: 160px; }
    .detail-photo { width: 160px; height: 160px; min-width: 160px; max-width: 160px; border-radius: 10px; object-fit: cover; cursor: pointer; display: block; flex-shrink: 0; }
    @media (max-width: 400px) {
      .detail-photo { width: 130px; height: 130px; min-width: 130px; max-width: 130px; }
      .detail-photos { min-height: 130px; }
    }
    .detail-section { background: var(--surface); border-radius: 10px; padding: 14px; }
    .detail-label { font-size: 11px; color: var(--accent); font-weight: 700; letter-spacing: 0.5px; margin-bottom: 6px; }
    .detail-value { font-size: 14px; line-height: 1.7; white-space: pre-wrap; }
    .detail-mono { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--blue); }
    .detail-error { color: var(--red) !important; }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--text2); }
    .form-input, .form-textarea, .form-select { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px 12px; font-size: 14px; font-family: 'Noto Sans JP', sans-serif; outline: none; width: 100%; }
    .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--accent); }
    .form-textarea { min-height: 100px; resize: vertical; line-height: 1.6; }
    .form-select option { background: var(--surface2); }
    .photo-upload-area { border: 2px dashed var(--border); border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; color: var(--text2); font-size: 14px; }
    .photo-upload-area:active { border-color: var(--accent); }
    .photo-btn-group { display: flex; gap: 8px; width: 100%; }
    .photo-btn { flex: 1; border: 2px solid var(--accent); border-radius: 10px; padding: 16px 8px; text-align: center; cursor: pointer; color: var(--text); font-size: 14px; font-weight: 700; font-family: "Noto Sans JP", sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--surface2); min-height: 60px; -webkit-user-select: none; user-select: none; }
    .photo-btn:active { background: var(--accent); color: #fff; }
    .photo-previews { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .photo-preview-wrap { position: relative; width: calc(min(22vw, 90px)); height: calc(min(22vw, 90px)); flex-shrink: 0; }
    .photo-preview { width: 100%; height: 100%; border-radius: 8px; object-fit: cover; display: block; }
    .photo-del { position: absolute; top: -6px; right: -6px; background: var(--red); color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .save-btn { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; width: 100%; margin-top: 8px; }
    .del-btn { background: transparent; color: var(--red); border: 1px solid var(--red); border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; width: 100%; }
    .sync-note { font-size: 11px; color: var(--green); text-align: center; padding: 8px; background: var(--surface); border-top: 1px solid var(--border); }

    /* ライトボックス */
    .lightbox { position: fixed; inset: 0; background: #000; z-index: 500; display: none; flex-direction: column; }
    .lightbox.open { display: flex; }
    .lb-header { position: absolute; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: linear-gradient(rgba(0,0,0,0.65), transparent); }
    .lb-close { background: rgba(255,255,255,0.18); border: none; color: #fff; border-radius: 50%; width: 38px; height: 38px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .lb-counter { color: rgba(255,255,255,0.85); font-size: 14px; font-weight: 600; }
    .lb-reset { background: rgba(255,255,255,0.18); border: none; color: #fff; border-radius: 20px; padding: 6px 12px; font-size: 12px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; }
    .lb-track { flex: 1; overflow: hidden; position: relative; }
    .lb-slides { display: flex; width: 100%; height: 100%; }
    .lb-slide { min-width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 70px 0 60px; overflow: hidden; }
    .lb-slide img { max-width: 100%; max-height: 100%; object-fit: contain; transform-origin: center; transition: transform 0.1s; touch-action: none; }
    .lb-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.18); border: none; color: #fff; border-radius: 50%; width: 44px; height: 44px; font-size: 28px; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; }
    .lb-arrow.prev { left: 10px; }
    .lb-arrow.next { right: 10px; }
    .lb-dots { position: absolute; bottom: 16px; left: 0; right: 0; display: flex; justify-content: center; gap: 7px; }
    .lb-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.35); }
    .lb-dot.active { background: #fff; }

    /* ローディング */
    #loadingOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 999; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingMsg { color: #fff; font-size: 14px; }
  </style>
</head>
<body>

<!-- ローディング -->
<div id="loadingOverlay">
  <div class="spinner"></div>
  <div id="loadingMsg">処理中...</div>
</div>

<!-- ログイン画面 -->
<div id="loginScreen" style="display:none">
  <div class="login-logo">修理<span>図鑑</span></div>
  <div class="login-sub">Googleアカウントでログインすると<br>データがクラウドに保存されます</div>
  <button class="google-btn" onclick="loginGoogle()">
    <svg width="20" height="20" viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.7 2.5 30.2 0 24 0 14.7 0 6.7 5.4 2.9 13.3l7.8 6C12.5 13 17.9 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8C43.8 37.4 46.5 31.4 46.5 24.5z"/>
      <path fill="#FBBC05" d="M10.7 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.8-6A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.5 10.8l8.2-6.1z"/>
      <path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.1 0-11.3-4.1-13.2-9.7l-8.1 6.3C6.7 42.6 14.7 48 24 48z"/>
    </svg>
    Googleでログイン
  </button>
</div>

<!-- メインアプリ -->
<div id="mainApp">
  <div class="header">
    <div class="user-bar">
      <span id="userEmail"></span>
      <button class="icon-btn" onclick="logout()">ログアウト</button>
    </div>
    <div class="header-top">
      <div class="logo">修理<span>図鑑</span></div>
      <button class="add-btn" onclick="openForm(null)">＋ 追加</button>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" placeholder="機種名・エラーコード・メモで検索..." oninput="renderList()">
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="list" id="list"><div class="empty"><div class="empty-icon">⏳</div><p>読み込み中...</p></div></div>
  <div class="sync-note">☁️ Firebase にリアルタイム同期中</div>

  <!-- ライトボックス -->
  <div class="lightbox" id="lightbox">
    <div class="lb-header">
      <button class="lb-close" onclick="closeLightbox()">✕</button>
      <div class="lb-counter" id="lbCounter"></div>
      <button class="lb-reset" onclick="lbResetZoom()">等倍に戻す</button>
    </div>
    <div class="lb-track" id="lbTrack">
      <div class="lb-slides" id="lbSlides"></div>
      <button class="lb-arrow prev" id="lbPrev" onclick="lbMove(-1)">‹</button>
      <button class="lb-arrow next" id="lbNext" onclick="lbMove(1)">›</button>
      <div class="lb-dots" id="lbDots"></div>
    </div>
  </div>

  <!-- 詳細 -->
  <div class="overlay" id="detailOverlay">
    <div class="overlay-header">
      <button class="back-btn" onclick="closeOverlay('detailOverlay')">← 戻る</button>
      <div class="overlay-title" id="detailTitle"></div>
      <button class="add-btn" id="detailEditBtn">編集</button>
    </div>
    <div class="overlay-body" id="detailBody"></div>
  </div>

  <!-- フォーム -->
  <div class="overlay" id="formOverlay">
    <div class="overlay-header">
      <button class="back-btn" onclick="closeOverlay('formOverlay')">← キャンセル</button>
      <div class="overlay-title" id="formTitle"></div>
    </div>
    <div class="overlay-body">
      <div class="form-group">
        <div class="form-label">写真</div>
        <div class="photo-btn-group">
          <button type="button" class="photo-btn" onclick="document.getElementById('cameraInput').click()">📷 カメラ撮影</button>
          <button type="button" class="photo-btn" onclick="document.getElementById('photoInput').click()">🖼 ライブラリ</button>
        </div>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="position:absolute;left:-9999px;opacity:0;" onchange="handlePhotos(event)">
        <input type="file" id="photoInput" accept="image/*" multiple style="position:absolute;left:-9999px;opacity:0;" onchange="handlePhotos(event)">
        <div class="photo-previews" id="photoPreviews"></div>
      </div>
      <div class="form-group">
        <div class="form-label">カテゴリ</div>
        <select class="form-select" id="fCategory"></select>
      </div>
      <div class="form-group">
        <div class="form-label">機種名・型番 ＊</div>
        <input class="form-input" id="fModel" placeholder="例: RUF-A2005SAW">
      </div>
      <div class="form-group">
        <div class="form-label">エラーコード</div>
        <input class="form-input" id="fError" placeholder="例: 632, E01">
      </div>
      <div class="form-group">
        <div class="form-label">部品番号</div>
        <input class="form-input" id="fPart" placeholder="例: 131-2345-000">
      </div>
      <div class="form-group">
        <div class="form-label">修理内容メモ</div>
        <textarea class="form-textarea" id="fMemo" placeholder="症状・原因・対処内容など..."></textarea>
      </div>
      <button class="save-btn" onclick="saveRecord()">💾 保存する</button>
      <button class="del-btn" id="delBtn" onclick="deleteRecord()" style="display:none">🗑 この記録を削除</button>
    </div>
  </div>
</div>

</body>
</html>
